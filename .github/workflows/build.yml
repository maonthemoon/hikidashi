# テストと, Linux(mingw-w64)でのWindows向けのビルドとZIP.
# v で始まるタグ(例: v0.1.0)をpushすると, ZIPをReleasesに置き,
# bin/Hikidashi.exe をそのexeに差し替えて main にcommitする(gitで取ってきた人がすぐ使えるように).
# v0.1.0-rc.1 のように - の付くタグは試しの版: Releaseはプレリリースにし, bin/ は差し替えない.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Run tests
        run: cargo test --locked
      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ github.ref_name }}"
          if [ "v${{ steps.version.outputs.version }}" != "${tag%%-*}" ]; then
            echo "タグ ${{ github.ref_name }} と Cargo.toml のバージョン ${{ steps.version.outputs.version }} が違います"
            exit 1
          fi
      - name: Build Hikidashi.exe
        # exeの中のエラー文に手元のパスが残らないよう置き換える(tools/build-exe.shと同じ)
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/home --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry/src=/cargo --remap-path-prefix=$PWD=/hikidashi"
          cargo build --release --locked --target x86_64-pc-windows-gnu -p hikidashi
      - name: Package
        id: package
        run: |
          # ZIPの中はリポジトリと同じ置き方にする(K81. wakudoriと同じ). ZIPは1重
          mkdir -p dist/bin dist/docs
          cp target/x86_64-pc-windows-gnu/release/hikidashi.exe dist/bin/Hikidashi.exe
          # トレイのManualはexeの1つ上のdocs/manual.htmlを開く(K46)
          cp docs/manual.html dist/docs/manual.html
          # 辞書(GPL)はexeとは別のファイルとしてexeの隣に置く(K35, K36). bin/に置いたものを使う(tools/update-dict.sh)
          cp bin/SKK-JISYO.L bin/SKK-JISYO.L-COPYING.txt dist/bin/
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          echo "name=Hikidashi-${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Make ZIP
        run: |
          tag="${{ github.ref_name }}"
          (cd dist && zip -r "../Hikidashi-${tag#v}.zip" .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "${{ github.ref_name }}" in *-*) pre=(--prerelease) ;; esac
          gh release create "${{ github.ref_name }}" Hikidashi-*.zip \
            --repo "${{ github.repository }}" \
            --title "Hikidashi ${{ github.ref_name }}" \
            --generate-notes "${pre[@]}"
      - uses: actions/checkout@v7
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          ref: main
          path: repo
      - name: Commit bin/Hikidashi.exe to main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p repo/bin
          cp dist/bin/Hikidashi.exe repo/bin/Hikidashi.exe
          cd repo
          if git diff --quiet -- bin/Hikidashi.exe && git ls-files --error-unmatch bin/Hikidashi.exe >/dev/null 2>&1; then
            echo "bin/Hikidashi.exe is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/Hikidashi.exe
          git commit -m "Hikidashi.exeを${{ github.ref_name }}にする"
          git push origin HEAD:main

# テストと, Linux(mingw-w64)でのWindows向けのビルドとZIP.
# v で始まるタグ(例: v0.1.0)をpushすると, ZIPをReleasesに置き,
# bin/Hikidashi.exe をそのexeに差し替えて main にcommitする(gitで取ってきた人がすぐ使えるように).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Run tests
        run: cargo test --locked
      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "タグ ${{ github.ref_name }} と Cargo.toml のバージョン ${{ steps.version.outputs.version }} が違います"
            exit 1
          fi
      - name: Build Hikidashi.exe
        # exeの中のエラー文に手元のパスが残らないよう置き換える(tools/build-exe.shと同じ)
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/home --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry/src=/cargo --remap-path-prefix=$PWD=/hikidashi"
          cargo build --release --locked --target x86_64-pc-windows-gnu -p hikidashi
      - name: Package
        id: package
        run: |
          name="Hikidashi-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$name"
          cp target/x86_64-pc-windows-gnu/release/hikidashi.exe "dist/$name/Hikidashi.exe"
          cp LICENSE "dist/$name/LICENSE.txt"
          cp THIRD-PARTY-NOTICES.txt "dist/$name/"
          cp docs/index.html "dist/$name/Manual.html"
          # 辞書(GPL)はexeとは別のファイルとして同梱する(K35). GPLの本文を添える
          curl -fsSL https://raw.githubusercontent.com/skk-dev/dict/master/SKK-JISYO.L -o "dist/$name/SKK-JISYO.L"
          head -c 100 "dist/$name/SKK-JISYO.L" | grep -q "SKK\|coding" || { echo "SKK-JISYO.L looks wrong"; exit 1; }
          [ "$(stat -c %s "dist/$name/SKK-JISYO.L")" -gt 1000000 ] || { echo "SKK-JISYO.L is too small"; exit 1; }
          {
            echo "SKK-JISYO.L is from https://github.com/skk-dev/dict and is licensed under the"
            echo "GNU General Public License version 2 or later (see the top of SKK-JISYO.L)."
            echo "It is a separate file; Hikidashi.exe reads it at run time and is under the MIT License."
            echo "The full text of the GNU General Public License version 2 follows."
            echo
            curl -fsSL https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt
          } > "dist/$name/SKK-JISYO.L-COPYING.txt"
          (cd dist && zip -r "$name.zip" "$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Hikidashi ${{ github.ref_name }}" \
            --generate-notes
      - uses: actions/checkout@v7
        with:
          ref: main
          path: repo
      - name: Commit bin/Hikidashi.exe to main
        run: |
          mkdir -p repo/bin
          unzip -o -j dist/*.zip '*/Hikidashi.exe' -d repo/bin
          cd repo
          if git diff --quiet -- bin/Hikidashi.exe && git ls-files --error-unmatch bin/Hikidashi.exe >/dev/null 2>&1; then
            echo "bin/Hikidashi.exe is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/Hikidashi.exe
          git commit -m "Hikidashi.exeを${{ github.ref_name }}にする"
          git push origin HEAD:main

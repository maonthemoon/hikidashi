[workspace]
members = ["crates/core", "crates/app", "crates/ext"]
default-members = ["crates/core", "crates/ext"]
resolver = "2"

[workspace.package]
version = "0.2.10"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# cargo testでも最適化する(50万件の検索の速さのテストが遅くならないように)
[profile.test]
opt-level = 2
